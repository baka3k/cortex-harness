[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cortex-harness"
version = "0.1.0"
description = "Unified CLI for CortexHarness code and document ingestion"
requires-python = ">=3.12"
dependencies = [
    "click",
    "requests",
    "qdrant-client",
    "falkordblite",
    "python-dotenv>=1.2.2",
    "portalocker>=3.2,<4",
]

[project.optional-dependencies]
# Optional Neo4j support is isolated from the default local runtime.
neo4j = ["neo4j", "neo4j-graphrag"]
# Remote FalkorDB client support (not used by the default local runtime).
falkordb-remote = ["falkordb"]

[project.scripts]
dev = "cortex_harness.dev:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["cortex_harness*"]