[package]
name = "cortex-extract"
version = "0.1.0"
edition = "2021"
description = "Native extension for cortex-harness analyzer pipeline (PyO3 + tree-sitter)"
license = "Apache-2.0"

[lib]
name = "cortex_extract"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.21", features = ["extension-module"] }
tree-sitter = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-c = "0.23"
rayon = "1.10"
regex = "1.10"
once_cell = "1.19"
stacker = "0.1"
serde_json = "1.0"

[build-dependencies]

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
