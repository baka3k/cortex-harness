[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "cortex-extract"
version = "0.1.0"
description = "Native extension for cortex-harness analyzer pipeline"
requires-python = ">=3.8"

[tool.maturin]
module-name = "cortex_extract"
features = ["pyo3/extension-module"]
python-source = "python"
