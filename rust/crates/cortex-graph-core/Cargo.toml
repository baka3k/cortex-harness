[package]
name = "cortex-graph-core"
version = "0.1.0"
edition = "2024"
description = "Rust port of the CortexHarness graph core (schema manifest + journal)"
license = "MIT"

[dependencies]
cortex-retrieval = { path = "../cortex-retrieval" }
getrandom = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[lints.rust]
unsafe_code = "deny"
