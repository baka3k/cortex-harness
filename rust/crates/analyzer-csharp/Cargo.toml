[package]
name = "analyzer-csharp"
version = "0.1.0"
edition = "2024"
description = "Rust entry cho C# analyzer — spawn THẲNG Roslyn worker C# (tools/csharp/roslyn_worker, giữ nguyên) thay entry Python + roslyn_adapter.py (phase 03 analyzer-layer-rust-cutover)"
license = "MIT"
publish = false

[[bin]]
name = "analyzer-csharp"
path = "src/main.rs"

[dependencies]
cortex-analyzer-framework = { path = "../cortex-analyzer-framework" }
cortex-graph-writer = { path = "../cortex-graph-writer" }
cortex-falkordb = { path = "../cortex-falkordb" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "deny"
