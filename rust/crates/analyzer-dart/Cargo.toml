[package]
name = "analyzer-dart"
version = "0.1.0"
edition = "2024"
description = "Rust port của code-tiny/tools/flutter/ (flutter_analyzer.py + dart_parser.py + normalizer/detector/cache) — mode `dart` (primary) + `flutter` (overlay), phase 02 analyzer-layer-rust-cutover"
license = "MIT"
publish = false

[[bin]]
name = "analyzer-dart"
path = "src/main.rs"

[dependencies]
cortex-analyzer-framework = { path = "../cortex-analyzer-framework" }
cortex-falkordb = { path = "../cortex-falkordb" }
cortex-graph-writer = { path = "../cortex-graph-writer" }
dart-grammar-vendored = { path = "../dart-grammar" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tree-sitter = "0.25"

[lints.rust]
unsafe_code = "deny"
