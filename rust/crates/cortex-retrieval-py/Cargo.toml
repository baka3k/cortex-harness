[package]
name = "cortex-retrieval-py"
version = "0.1.0"
edition = "2024"
description = "PyO3 bindings: retrieval brain của CortexHarness cho Python MCP servers"
license = "MIT"
publish = false

[lib]
name = "cortex_retrieval_py"
crate-type = ["cdylib"]

[dependencies]
cortex-retrieval = { path = "../cortex-retrieval" }
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py312"] }
serde_json = "1"

[lints.rust]
unsafe_code = "deny"
