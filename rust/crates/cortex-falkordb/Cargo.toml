[package]
name = "cortex-falkordb"
version = "0.1.0"
edition = "2024"
description = "FalkorDB/Redis graph client cho CortexHarness — Phase 01 spike của rust-full-migration"
license = "MIT"
publish = false

[dependencies]
redis = { version = "1.7", default-features = false, features = ["script"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unsafe_code = "deny"
