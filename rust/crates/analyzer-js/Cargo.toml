[package]
name = "analyzer-js"
version = "0.1.0"
edition = "2024"
description = "Rust port của tools/js/js_analyzer.py — JavaScript call graph analyzer (phase 05 rust-full-migration)"
license = "MIT"
publish = false

[[bin]]
name = "analyzer-js"
path = "src/main.rs"

[dependencies]
cortex-analyzer-framework = { path = "../cortex-analyzer-framework" }
cortex-falkordb = { path = "../cortex-falkordb" }
cortex-graph-writer = { path = "../cortex-graph-writer" }
clap = { version = "4", features = ["derive"] }
regex = "1"
serde_json = "1"
tree-sitter = "0.25"
tree-sitter-javascript = "0.25"

[lints.rust]
unsafe_code = "deny"
