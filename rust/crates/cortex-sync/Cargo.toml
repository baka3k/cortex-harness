[package]
name = "cortex-sync"
version = "0.1.0"
edition = "2024"
description = "Rust port of code-tiny/tools/sync/incremental_sync.py — incremental-sync orchestrator main line (phase 09 rust-full-migration)"
license = "MIT"
publish = false

[[bin]]
name = "cortex-sync"
path = "src/main.rs"

[dependencies]
cortex-graph-core = { path = "../cortex-graph-core" }
cortex-graph-writer = { path = "../cortex-graph-writer" }
cortex-falkordb = { path = "../cortex-falkordb" }
clap = { version = "4", features = ["derive"] }
getrandom = "0.2"
libc = "0.2"
redis = { version = "1.7", default-features = false, features = ["script"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"

[lints.rust]
unsafe_code = "deny"
