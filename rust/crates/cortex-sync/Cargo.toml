[package]
name = "cortex-sync"
version = "0.1.0"
edition = "2024"
description = "Rust port of code-tiny/tools/sync/incremental_sync.py — incremental-sync orchestrator main line (phase 09 rust-full-migration)"
license = "MIT"
publish = false

[[bin]]
name = "cortex-sync"
path = "src/main.rs"

[lib]
name = "cortex_sync"
path = "src/lib.rs"

[dependencies]
cortex-graph-core = { path = "../cortex-graph-core" }
cortex-graph-writer = { path = "../cortex-graph-writer" }
cortex-falkordb = { path = "../cortex-falkordb" }
cortex-analyzer-framework = { path = "../cortex-analyzer-framework" }
cortex-embed = { path = "../cortex-embed" }
cortex-storage = { path = "../cortex-storage" }
clap = { version = "4", features = ["derive"] }
getrandom = "0.2"
libc = "0.2"
once_cell = "1"
redis = { version = "1.7", default-features = false, features = ["script"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
# Phase-06 vector plane: tier-2 redaction uses a backreference (Python re),
# which the plain `regex` crate cannot express.
fancy-regex = "0.14"
# `deterministic_point_id` = uuid5 over the custom `_POINT_NAMESPACE`.
uuid = { version = "1", features = ["v5"] }
# `unsafe_code = "deny"` lives as a source-level attribute in main.rs so the
# test build can scope-lift it (registry_tests mutates process env).
