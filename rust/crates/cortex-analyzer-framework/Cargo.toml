[package]
name = "cortex-analyzer-framework"
version = "0.1.0"
edition = "2024"
description = "Rust port của analyzer framework: CLI contract, scan/manifest, semantic inference, tree-sitter helpers (phase 04 rust-full-migration)"
license = "MIT"
publish = false

[dependencies]
cortex-falkordb = { path = "../cortex-falkordb" }
cortex-graph-writer = { path = "../cortex-graph-writer" }
clap = { version = "4", features = ["derive"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tree-sitter = "0.25"

[lints.rust]
unsafe_code = "deny"
