[package]
name = "cortex-graph-writer"
version = "0.1.0"
edition = "2024"
description = "Rust port của CortexHarness graph writer: query contract, language writer, operations, topology writer, preflight (phase 03 rust-full-migration)"
license = "MIT"
publish = false

[dependencies]
cortex-graph-core = { path = "../cortex-graph-core" }
cortex-falkordb = { path = "../cortex-falkordb" }
lbug = "0.20.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "deny"
