[package]
name = "cortex-mcp"
version = "0.1.0"
edition = "2024"
description = "Rust port của CortexHarness MCP server framework (phase 11 rust-full-migration): wire contract cortex.mcp.tool-result v1.0, tool catalog, capability registry, project registry, rmcp streamable-HTTP server"
license = "MIT"
publish = false

[[bin]]
name = "cortex-mcp"
path = "src/main.rs"

[dependencies]
cortex-graph-writer = { path = "../cortex-graph-writer" }
cortex-falkordb = { path = "../cortex-falkordb" }
cortex-retrieval = { path = "../cortex-retrieval" }
redis = { version = "1.7", default-features = false, features = ["script"] }
rmcp = { version = "3.3.0", features = ["server", "transport-streamable-http-server"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio-util = "0.7"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "deny"
