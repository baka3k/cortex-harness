---
name: COBOL macOS compatibility

on:
  pull_request:
    paths:
      - ".github/workflows/cobol-macos.yml"
      - "rust/crates/analyzer-cobol/**"
      - "rust/crates/analyzer-framework/**"
      - "scripts/rust_parity/analyzer_parity_cobol.py"
      - "tests/test_cobol*.py"
      - "tests/fixtures/cobol-*/**"
  push:
    branches: [develop]
    paths:
      - ".github/workflows/cobol-macos.yml"
      - "rust/crates/analyzer-cobol/**"
      - "rust/crates/analyzer-framework/**"
      - "scripts/rust_parity/analyzer_parity_cobol.py"
      - "tests/test_cobol*.py"
      - "tests/fixtures/cobol-*/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.name }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Intel
            os: macos-15-intel
            architecture: x86_64
            python: "3.12"
          - name: Apple-Silicon
            os: macos-15
            architecture: arm64
            python: "3.12"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install analyzer runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . "tree-sitter>=0.25,<0.26" "tree-sitter-language-pack>=1.12,<2"
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Build COBOL analyzer (Rust binary replaces Python entry post-cutover)
        run: cargo build --release -p analyzer-cobol
      - name: Verify runner architecture
        run: test "$(uname -m)" = "${{ matrix.architecture }}"
      - name: Run COBOL preflight (Rust binary)
        run: ./rust/target/release/analyzer-cobol --root tests/fixtures/cobol-application --preflight
      - name: Run COBOL parity (Rust binary vs Python reference fixture)
        run: .venv/bin/python scripts/rust_parity/analyzer_parity_cobol.py
      - name: Run COBOL suite (Python unit tests — kept until phase-08 delete commit)
        run: python -m unittest discover -s tests -p 'test_cobol*.py' -v
